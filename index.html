<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>HANGMAN</h1>

    <h2>How to Play</h2>
    <p>Guess the hidden word by choosing letters.</p>
    <p>You have 6 wrong guesses before you lose.</p>

    <h2 id="word"></h2>

    <p id="wrong-guesses">Wrong Guesses: 0 / 6</p>

    <div id="letters"></div>

    <h2 id="message"></h2>

    <button id="restart">Play Again</button>

    <script src="app.js"></script>
</body>
</html>
